name: Terraform validation

on:
  pull_request:
    paths:
      - "**/*.tf"
      - ".github/workflows/terraform-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - aws-vpc-project
          - aws-vpc-project/examples/basic
          - terraform-ec2-creation
          - terraform-variables
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Check formatting
        run: terraform -chdir="${{ matrix.directory }}" fmt -check -recursive

      - name: Initialize without a backend
        run: terraform -chdir="${{ matrix.directory }}" init -backend=false -input=false

      - name: Validate configuration
        run: terraform -chdir="${{ matrix.directory }}" validate